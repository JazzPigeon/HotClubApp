name: CI

on:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ui-tests:
    name: UI Tests (Regression test plan)
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Secrets.plist for CI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY repository secrets for CI."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string '$SUPABASE_URL'" HotClubApp/Secrets.plist
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_ANON_KEY string '$SUPABASE_ANON_KEY'" HotClubApp/Secrets.plist

      - name: Run Regression test plan
        run: |
          set -o pipefail
          xcodebuild test \
            -project HotClubApp.xcodeproj \
            -scheme HotClubApp \
            -testPlan Regression \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Create Test Summary
        if: always()
        run: |
          RESULT_JSON=$(xcrun xcresulttool get test-results summary --path TestResults.xcresult)
          PASSED=$(echo "$RESULT_JSON" | jq -r '.passedTests // 0')
          FAILED=$(echo "$RESULT_JSON" | jq -r '.failedTests // 0')
          echo "## UI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Passed: $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Failed: $FAILED" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
            echo "$RESULT_JSON" | jq -r '
              (.testFailures // empty | if type == "array" then .[] else . end) |
              "- **\(.testIdentifierString // "\(.targetName)/\(.testName)")**\n  - \(.failureText | gsub("\n"; " "))"
            ' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Allure
        if: always()
        run: npm ci

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            npx allure generate TestResults.xcresult
          else
            echo "No TestResults.xcresult found; skipping Allure report."
          fi
          
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
